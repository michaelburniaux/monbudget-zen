workflows:
  android-debug:
    name: Mon Budget ZEN Android
    max_build_duration: 60

    environment:
      node: 20
      java: 21

    scripts:
      - name: Install Capacitor
        script: |
          npm install

      - name: Prepare web files
        script: |
          rm -rf www
          mkdir -p www
          cp index.html privacy.html about.html manifest.webmanifest sw.js ads.txt www/

      - name: Create Android project
        script: |
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk


  ios-app-store:
    name: Mon Budget ZEN App Store
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic Mon Budget ZEN

    environment:
      node: 20
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.michaelburniaux.monbudget

      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install Capacitor and AdMob
        script: |
          npm install

      - name: Prepare web files
        script: |
          rm -rf www
          mkdir -p www
          cp index.html privacy.html about.html manifest.webmanifest sw.js ads.txt www/

      - name: Create iOS project without AdMob plugin
        script: |
          npm uninstall @capacitor-community/admob
          npx cap add ios

      - name: Set iOS 15 before AdMob
        script: |
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile

      - name: Reinstall AdMob and sync iOS
        script: |
          npm install @capacitor-community/admob@7
          npx cap sync ios

      - name: Configure AdMob iOS
        script: |
          /usr/libexec/PlistBuddy \
            -c "Add :GADApplicationIdentifier string ca-app-pub-1076788224709799~8711250560" \
            ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy \
            -c "Set :GADApplicationIdentifier ca-app-pub-1076788224709799~8711250560" \
            ios/App/App/Info.plist

      - name: Set iOS build number
        script: |
          cd ios/App
          agvtool new-version -all 6

      - name: Apply Apple signing
        script: |
          cd ios/App
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
