workflows:

  android-debug:
    name: Mon Budget ZEN Android
    max_build_duration: 60

    environment:
      node: 20
      java: 21

    scripts:

      - name: Install dependencies
        script: |
          npm install

      - name: Prepare web files
        script: |
          rm -rf www
          mkdir -p www
          cp index.html privacy.html about.html manifest.webmanifest sw.js ads.txt www/

      - name: Create Android project
        script: |
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk


  ios-app-store:
    name: Mon Budget ZEN App Store
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic Mon Budget ZEN

    environment:
      node: 20
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.michaelburniaux.monbudget

      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"

    scripts:

      - name: Install dependencies
        script: |
          npm install
          npm install @pantrist/capacitor-plugin-ml-kit-text-recognition@7

      - name: Verify OCR dependency
        script: |
          node -e "const p=require('./node_modules/@pantrist/capacitor-plugin-ml-kit-text-recognition/package.json'); if(!String(p.version).startsWith('7.')){ console.error('ERREUR : le module OCR doit être en version 7.x pour Capacitor 7. Version trouvée : '+p.version); process.exit(1); } console.log('OK : module OCR installé en version '+p.version);"

      - name: Verify Local Notifications dependency
        script: |
          node -e "const p=require('./node_modules/@capacitor/local-notifications/package.json'); if(!String(p.version).startsWith('7.')){ console.error('ERREUR : Local Notifications doit être en version 7.x pour Capacitor 7. Version trouvée : '+p.version); process.exit(1); } console.log('OK : Local Notifications installé en version '+p.version);"

      - name: Prepare web files
        script: |
          rm -rf www
          mkdir -p www
          cp index.html privacy.html about.html manifest.webmanifest sw.js ads.txt www/

      - name: Create clean iOS project
        script: |
          # IMPORTANT :
          # "npx cap add ios" lance déjà une synchronisation CocoaPods.
          # On retire donc temporairement AdMob ET le plugin OCR avant de créer
          # le projet iOS, afin d'éviter que ML Kit tente de s'installer
          # alors que le Podfile est encore réglé sur iOS 15.0.
          npm uninstall @capacitor-community/admob
          npm uninstall @pantrist/capacitor-plugin-ml-kit-text-recognition
          npx cap add ios

      - name: Set iOS 15.5 before native plugins
        script: |
          echo "=== Passage du deployment target à iOS 15.5 ==="

          PODFILE="ios/App/Podfile"

          if [ ! -f "$PODFILE" ]; then
            echo "ERREUR : Podfile introuvable."
            exit 1
          fi

          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.5'/" "$PODFILE"

          if ! grep -q "platform :ios, '15.5'" "$PODFILE"; then
            echo "ERREUR : impossible de régler le Podfile sur iOS 15.5."
            cat "$PODFILE"
            exit 1
          fi

          # Même valeur dans le projet Xcode pour éviter toute incohérence
          # entre le projet principal et les Pods.
          python3 <<'PYTHON'
          from pathlib import Path

          p = Path("ios/App/App.xcodeproj/project.pbxproj")
          if not p.exists():
              raise SystemExit("ERREUR : project.pbxproj introuvable")

          text = p.read_text()

          import re
          text = re.sub(
              r"IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;",
              "IPHONEOS_DEPLOYMENT_TARGET = 15.5;",
              text
          )

          p.write_text(text)
          print("OK : deployment target Xcode réglé sur iOS 15.5.")
          PYTHON

          echo "OK : Podfile réglé sur iOS 15.5."

      - name: Reinstall OCR and AdMob
        script: |
          npm install @pantrist/capacitor-plugin-ml-kit-text-recognition@7
          npm install @capacitor-community/admob@7

      - name: Sync Capacitor plugins
        script: |
          npx cap sync ios

      - name: Verify iOS 15.5 and OCR plugin
        script: |
          echo "=== Vérification iOS 15.5 + OCR ==="

          if ! grep -q "platform :ios, '15.5'" ios/App/Podfile; then
            echo "ERREUR : le Podfile n'est pas réglé sur iOS 15.5."
            exit 1
          fi

          if [ ! -d "node_modules/@pantrist/capacitor-plugin-ml-kit-text-recognition" ]; then
            echo "ERREUR : le module OCR est absent de node_modules."
            exit 1
          fi

          if ! grep -qi "TextRecognition" ios/App/Podfile.lock; then
            echo "ERREUR : le module OCR / ML Kit TextRecognition n'apparaît pas dans Podfile.lock."
            exit 1
          fi

          echo "OK : iOS 15.5 est actif et le module OCR est intégré."

      - name: Verify Camera plugin is installed
        script: |
          echo "=== Vérification du plugin Camera ==="
          if ! grep -q "CapacitorCamera" ios/App/Podfile.lock; then
            echo "ERREUR : le plugin CapacitorCamera n'est pas présent dans Podfile.lock."
            exit 1
          fi
          echo "OK : CapacitorCamera est bien installé."

      - name: Verify Local Notifications plugin is installed
        script: |
          echo "=== Vérification du plugin Local Notifications ==="
          if ! grep -q "CapacitorLocalNotifications" ios/App/Podfile.lock; then
            echo "ERREUR : le plugin CapacitorLocalNotifications n'est pas présent dans Podfile.lock."
            exit 1
          fi
          echo "OK : CapacitorLocalNotifications est bien installé."

      - name: Configure AdMob iOS
        script: |
          /usr/libexec/PlistBuddy \
            -c "Add :GADApplicationIdentifier string ca-app-pub-1076788224709799~8711250560" \
            ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy \
            -c "Set :GADApplicationIdentifier ca-app-pub-1076788224709799~8711250560" \
            ios/App/App/Info.plist

      - name: Configure Camera and Photo Library permissions
        script: |
          python3 <<'PYTHON'
          import plistlib
          from pathlib import Path

          plist_path = Path("ios/App/App/Info.plist")
          if not plist_path.exists():
              raise SystemExit(f"ERREUR : {plist_path} introuvable")

          with plist_path.open("rb") as f:
              plist = plistlib.load(f)

          plist["NSCameraUsageDescription"] = "Mon Budget ZEN utilise l'appareil photo pour photographier et archiver vos factures."
          plist["NSPhotoLibraryUsageDescription"] = "Mon Budget ZEN utilise votre photothèque pour importer et archiver vos factures."
          plist["NSPhotoLibraryAddUsageDescription"] = "Mon Budget ZEN peut enregistrer les photos de factures dans votre photothèque lorsque vous le demandez."

          with plist_path.open("wb") as f:
              plistlib.dump(plist, f, fmt=plistlib.FMT_XML, sort_keys=False)

          print("OK : permissions caméra et photothèque écrites directement dans Info.plist.")
          PYTHON

          # Deuxième sécurité : inscrire aussi les valeurs dans les réglages Xcode.
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          python3 <<'PYTHON'
          from pathlib import Path

          p = Path("ios/App/App.xcodeproj/project.pbxproj")
          text = p.read_text()
          marker = "INFOPLIST_KEY_NSCameraUsageDescription"
          if marker not in text:
              text = text.replace(
                  "buildSettings = {",
                  "buildSettings = {\n\t\t\t\tINFOPLIST_KEY_NSCameraUsageDescription = \"Mon Budget ZEN utilise l'appareil photo pour photographier et archiver vos factures.\";\n\t\t\t\tINFOPLIST_KEY_NSPhotoLibraryUsageDescription = \"Mon Budget ZEN utilise votre photothèque pour importer et archiver vos factures.\";",
              )
              p.write_text(text)
              print("OK : sécurité supplémentaire ajoutée aux réglages Xcode.")
          else:
              print("OK : réglages Xcode déjà présents.")
          PYTHON

      - name: Verify permissions before build
        script: |
          echo "=== Info.plist AVANT compilation ==="

          CAMERA_VALUE=$(/usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" ios/App/App/Info.plist 2>/dev/null || true)
          PHOTO_VALUE=$(/usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" ios/App/App/Info.plist 2>/dev/null || true)

          if [ -z "$CAMERA_VALUE" ]; then
            echo "ERREUR : NSCameraUsageDescription est absent avant compilation."
            exit 1
          fi

          if [ -z "$PHOTO_VALUE" ]; then
            echo "ERREUR : NSPhotoLibraryUsageDescription est absent avant compilation."
            exit 1
          fi

          echo "NSCameraUsageDescription = $CAMERA_VALUE"
          echo "NSPhotoLibraryUsageDescription = $PHOTO_VALUE"
          echo "OK : les autorisations sont présentes avant compilation."

      - name: Set iOS build number
        script: |
          set -e
          echo "=== Forçage du build Apple à 22 ==="

          cd ios/App

          # 1) Réglage Xcode standard.
          agvtool new-version -all 22 || true

          # 2) Force CURRENT_PROJECT_VERSION dans le projet Xcode.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("App.xcodeproj/project.pbxproj")
          s=p.read_text()
          s,n=re.subn(r'CURRENT_PROJECT_VERSION = [^;]+;', 'CURRENT_PROJECT_VERSION = 22;', s)
          if n == 0:
              raise SystemExit("ERREUR : CURRENT_PROJECT_VERSION introuvable dans project.pbxproj")
          p.write_text(s)
          print(f"OK : CURRENT_PROJECT_VERSION forcé à 22 ({n} occurrence(s)).")
          PY

          # 3) Force aussi CFBundleVersion dans le vrai Info.plist de l'app.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 22" App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 22" App/Info.plist

          echo "=== Vérification AVANT signature ==="
          PLIST_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" App/Info.plist)
          echo "Info.plist CFBundleVersion = $PLIST_BUILD"
          if [ "$PLIST_BUILD" != "22" ]; then
            echo "ERREUR : Info.plist n'est pas au build 22."
            exit 1
          fi

          PBX_OTHER=$(grep -E "CURRENT_PROJECT_VERSION = " App.xcodeproj/project.pbxproj | grep -v "CURRENT_PROJECT_VERSION = 22;" || true)
          if [ -n "$PBX_OTHER" ]; then
            echo "ERREUR : au moins une configuration Xcode n'est pas au build 22 :"
            echo "$PBX_OTHER"
            exit 1
          fi

          echo "OK : le projet iOS est intégralement réglé sur le build 22."
          cd ../..

      - name: Apply Apple signing
        script: |
          cd ios/App
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Verify permissions inside final IPA
        script: |
          echo "=== Vérification de l'IPA réellement compilée ==="

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "ERREUR : aucune IPA trouvée."
            exit 1
          fi

          rm -rf /tmp/monbudget_ipa_check
          mkdir -p /tmp/monbudget_ipa_check
          unzip -q "$IPA_PATH" -d /tmp/monbudget_ipa_check

          APP_PLIST=$(find /tmp/monbudget_ipa_check/Payload -maxdepth 2 -name Info.plist | head -n 1)

          if [ -z "$APP_PLIST" ]; then
            echo "ERREUR : Info.plist introuvable dans l'IPA."
            exit 1
          fi

          CAMERA_VALUE=$(/usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP_PLIST" 2>/dev/null || true)
          PHOTO_VALUE=$(/usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$APP_PLIST" 2>/dev/null || true)
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PLIST" 2>/dev/null || true)
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST" 2>/dev/null || true)

          echo "Bundle ID : $APP_ID"
          echo "Build : $BUILD_NUMBER"
          echo "NSCameraUsageDescription : $CAMERA_VALUE"
          echo "NSPhotoLibraryUsageDescription : $PHOTO_VALUE"

          if [ "$APP_ID" != "com.michaelburniaux.monbudget" ]; then
            echo "ERREUR : mauvais Bundle ID dans l'IPA finale."
            exit 1
          fi

          if [ "$BUILD_NUMBER" != "22" ]; then
            echo "ERREUR : le numéro de build final n'est pas 22."
            exit 1
          fi

          if [ -z "$CAMERA_VALUE" ]; then
            echo "ERREUR : NSCameraUsageDescription est ABSENT de l'IPA finale."
            exit 1
          fi

          if [ -z "$PHOTO_VALUE" ]; then
            echo "ERREUR : NSPhotoLibraryUsageDescription est ABSENT de l'IPA finale."
            exit 1
          fi

          echo "OK : build 22 vérifié, avec autorisations caméra présentes dans l'IPA finale."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
